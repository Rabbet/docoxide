[package]
name = "docoxide"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
infer = "0.19.0"
libreoffice-rs = "0.3.3"
mime_guess = "2.0.5"
rouille = "3.6.2"
sanitize-filename = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.3", features = ["json", "multipart"] }
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4.5"
